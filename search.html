<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ค้นหา — ข้อสอบ</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .post{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:14px}
  .post .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
  .post .who{font-weight:700}
  .post .when{font-size:13px;color:var(--muted2);white-space:nowrap}
  .post .body{white-space:pre-wrap;line-height:1.6;margin-bottom:14px}
  .post .actions{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
  .actbtn{background:none;border:none;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--muted);
    padding:8px 14px;border-radius:8px;display:flex;align-items:center;gap:6px}
  .actbtn:hover{background:var(--card-hi);color:var(--ink)}
  .actbtn.liked{color:var(--accent)}
  .actbtn.delbtn{color:var(--danger);margin-left:auto}
  .comments{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .comment{display:flex;flex-direction:column;background:var(--bg0);border:1px solid var(--line);border-radius:10px;
    padding:10px 13px;margin-bottom:8px}
  .comment .who{font-weight:700;font-size:14px}
  .comment .when{font-size:12px;color:var(--muted2)}
  .comment .txt{font-size:14.5px;margin-top:3px;white-space:pre-wrap}
  .comment .delc{background:none;border:none;color:var(--danger);font-size:12px;cursor:pointer;margin-top:4px;align-self:flex-start}
  .commentForm{display:flex;gap:8px;margin-top:8px}
  .commentForm input{flex:1;min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:999px;font:inherit;font-size:14.5px}
</style>
</head>
<body>

<main>
  <section class="hero" style="padding-bottom:20px">
    <div class="wrap">
      <span class="eyebrow">ค้นหา</span>
      <h1 id="qHeading">ผลการค้นหา</h1>
    </div>
  </section>

  <section class="section" style="padding-top:10px">
    <div class="wrap" style="max-width:820px;margin:0 auto">
      <h2 style="font-size:19px;margin-bottom:14px">รายวิชา</h2>
      <div class="grid c3" id="subjectResults" style="margin-bottom:36px"></div>

      <h2 style="font-size:19px;margin-bottom:14px">โพสต์ในบอร์ดความคิดเห็น</h2>
      <div id="loginPrompt" class="card hidden" style="text-align:center;margin-bottom:20px">
        <p class="muted" style="margin-bottom:14px">เข้าสู่ระบบเพื่อค้นหาในบอร์ดความคิดเห็นด้วย</p>
        <a class="btn p" href="login.html">เข้าสู่ระบบ</a>
      </div>
      <div id="postResults"></div>
    </div>
  </section>
</main>

<script src="assets/site.js"></script>
<script src="assets/demo-data.js"></script>
<script>
(function(){
  "use strict";
  renderHeader();
  renderFooter();

  const q = new URLSearchParams(location.search).get("q") || "";
  document.getElementById("qHeading").textContent = q ? `ผลการค้นหา: "${q}"` : "ผลการค้นหา";
  const qLower = q.trim().toLowerCase();

  /* ── รายวิชา ── */
  const subjectMatches = qLower
    ? SUBJECTS.filter(s => s.name.toLowerCase().includes(qLower) || (s.desc || "").toLowerCase().includes(qLower))
    : [];
  const subjectBox = document.getElementById("subjectResults");
  subjectBox.innerHTML = subjectMatches.length
    ? subjectMatches.map(s => `
      <a class="card" href="exam.html?subject=${s.slug}">
        <span class="tag">${s.icon} ${escHtml(s.name)}</span>
        <h3>${escHtml(s.name)}</h3>
        <p>${escHtml(s.desc)}</p>
      </a>
    `).join("")
    : '<p class="muted">ไม่พบวิชาที่ตรงกับคำค้นหา</p>';

  /* ── โพสต์ในบอร์ดความคิดเห็น ── */
  const user = getSession();
  if (!user){
    document.getElementById("loginPrompt").classList.remove("hidden");
  } else {
    loadPostResults();
  }

  function subjectMeta(slug){ return SUBJECTS.find(s => s.slug === slug); }
  function fmtTime(iso){
    try { return new Date(iso).toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" }); }
    catch(e){ return ""; }
  }

  const expanded = new Set();
  const commentsCache = {};

  async function loadPostResults(){
    const box = document.getElementById("postResults");
    box.innerHTML = '<p class="muted">กำลังโหลด…</p>';
    const res = await apiCall("listPosts", { sort: "new", viewerEmail: user.email });
    if (!res.ok){ box.innerHTML = `<div class="msg bad">${escHtml(res.error || "โหลดไม่สำเร็จ")}</div>`; return; }
    const posts = (res.posts || []).filter(p => {
      if (!qLower) return false;
      const meta = subjectMeta(p.subject);
      return p.text.toLowerCase().includes(qLower) ||
             p.name.toLowerCase().includes(qLower) ||
             (meta && meta.name.toLowerCase().includes(qLower));
    });
    renderPosts(posts);
  }

  function renderPosts(posts){
    const box = document.getElementById("postResults");
    if (!posts.length){
      box.innerHTML = '<p class="muted">ไม่พบโพสต์ที่ตรงกับคำค้นหา</p>';
      return;
    }
    box.innerHTML = posts.map(p => {
      const meta = subjectMeta(p.subject);
      const open = expanded.has(p.id);
      const mine = p.email === user.email;
      return `
      <div class="post" data-id="${escHtml(p.id)}">
        <div class="head">
          <div>
            <div class="who">${escHtml(p.name)}</div>
            ${meta ? `<span class="tag" style="margin-top:6px">${meta.icon} ${escHtml(meta.name)}</span>` : ""}
          </div>
          <span class="when">${fmtTime(p.timestamp)}</span>
        </div>
        <div class="body">${escHtml(p.text)}</div>
        <div class="actions">
          <button class="actbtn likeBtn ${p.likedByMe ? "liked" : ""}" type="button">${p.likedByMe ? "❤️" : "🤍"} ถูกใจ (${p.likeCount})</button>
          <button class="actbtn cmtToggle" type="button">💬 ความคิดเห็น (${p.commentCount})</button>
          ${mine ? '<button class="actbtn delbtn delPostBtn" type="button">ลบโพสต์</button>' : ""}
        </div>
        <div class="comments ${open ? "" : "hidden"}">
          <div class="commentList"></div>
          <form class="commentForm">
            <input type="text" placeholder="เขียนความคิดเห็น…" maxlength="500" required>
            <button class="btn s" type="submit">ส่ง</button>
          </form>
        </div>
      </div>`;
    }).join("");

    box.querySelectorAll(".post").forEach(card => {
      const id = card.dataset.id;
      card.querySelector(".likeBtn").onclick = () => onToggleLike(id, card);
      card.querySelector(".cmtToggle").onclick = () => onToggleComments(id, card);
      const delBtn = card.querySelector(".delPostBtn");
      if (delBtn) delBtn.onclick = () => onDeletePost(id);
      card.querySelector(".commentForm").onsubmit = (e) => onAddComment(e, id, card);
      if (expanded.has(id)) renderComments(id, card);
    });
  }

  async function onToggleLike(id, card){
    const btn = card.querySelector(".likeBtn");
    btn.disabled = true;
    const res = await apiCall("toggleLike", { postId: id, email: user.email, name: user.name });
    btn.disabled = false;
    if (!res.ok) return;
    btn.classList.toggle("liked", res.liked);
    btn.textContent = `${res.liked ? "❤️" : "🤍"} ถูกใจ (${res.likeCount})`;
  }

  function onToggleComments(id, card){
    const box = card.querySelector(".comments");
    const nowOpen = box.classList.contains("hidden");
    box.classList.toggle("hidden");
    if (nowOpen){ expanded.add(id); renderComments(id, card); }
    else expanded.delete(id);
  }

  async function renderComments(id, card){
    const box = card.querySelector(".commentList");
    box.innerHTML = '<p class="muted" style="font-size:13.5px">กำลังโหลด…</p>';
    const res = await apiCall("listComments", { postId: id });
    commentsCache[id] = (res.ok && res.comments) || [];
    const comments = commentsCache[id];
    box.innerHTML = comments.length
      ? comments.map(c => `
        <div class="comment" data-id="${escHtml(c.id)}">
          <div style="display:flex;justify-content:space-between;gap:8px">
            <span class="who">${escHtml(c.name)}</span>
            <span class="when">${fmtTime(c.timestamp)}</span>
          </div>
          <div class="txt">${escHtml(c.text)}</div>
          ${c.email === user.email ? '<button class="delc" type="button">ลบความคิดเห็น</button>' : ""}
        </div>`).join("")
      : '<p class="muted" style="font-size:13.5px">ยังไม่มีความคิดเห็น</p>';

    box.querySelectorAll(".delc").forEach(btn => {
      btn.onclick = async () => {
        const commentId = btn.closest(".comment").dataset.id;
        const res2 = await apiCall("deleteComment", { commentId, email: user.email });
        if (res2.ok) renderComments(id, card);
      };
    });
  }

  async function onAddComment(e, id, card){
    e.preventDefault();
    const input = card.querySelector(".commentForm input");
    const text = input.value.trim();
    if (!text) return;
    const btn = card.querySelector(".commentForm button");
    btn.disabled = true;
    const res = await apiCall("addComment", { postId: id, email: user.email, name: user.name, text });
    btn.disabled = false;
    if (!res.ok) return;
    input.value = "";
    renderComments(id, card);
    const cmtBtn = card.querySelector(".cmtToggle");
    const n = ((commentsCache[id] || []).length);
    cmtBtn.textContent = `💬 ความคิดเห็น (${n})`;
  }

  async function onDeletePost(id){
    if (!confirm("ลบโพสต์นี้ทิ้ง?")) return;
    const res = await apiCall("deletePost", { postId: id, email: user.email });
    if (res.ok) loadPostResults();
  }
})();
</script>
</body>
</html>
