<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ค้นหา — ข้อสอบ</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<main>
  <section class="hero" style="padding-bottom:20px">
    <div class="wrap">
      <span class="eyebrow">ค้นหา</span>
      <h1 id="qHeading">ผลการค้นหา</h1>
    </div>
  </section>

  <section class="section" style="padding-top:10px">
    <div class="wrap" style="max-width:820px;margin:0 auto">
      <h2 style="font-size:19px;margin-bottom:14px">รายวิชา</h2>
      <div class="grid c3" id="subjectResults" style="margin-bottom:36px"></div>

      <h2 style="font-size:19px;margin-bottom:14px">โพสต์ในบอร์ดความคิดเห็น</h2>
      <div id="loginPrompt" class="card hidden" style="text-align:center;margin-bottom:20px">
        <p class="muted" style="margin-bottom:14px">เข้าสู่ระบบเพื่อค้นหาในบอร์ดความคิดเห็นด้วย</p>
        <a class="btn p" href="login.html">เข้าสู่ระบบ</a>
      </div>
      <div id="postResults"></div>
    </div>
  </section>
</main>

<script src="assets/site.js"></script>
<script src="assets/demo-data.js"></script>
<script>
(function(){
  "use strict";
  renderHeader();
  renderFooter();

  const q = new URLSearchParams(location.search).get("q") || "";
  document.getElementById("qHeading").textContent = q ? `ผลการค้นหา: "${q}"` : "ผลการค้นหา";
  const qLower = q.trim().toLowerCase();

  /* ── รายวิชา ── */
  const subjectMatches = qLower
    ? visibleSubjects().filter(s => s.name.toLowerCase().includes(qLower) || (s.desc || "").toLowerCase().includes(qLower))
    : [];
  const subjectBox = document.getElementById("subjectResults");
  subjectBox.innerHTML = subjectMatches.length
    ? subjectMatches.map(s => `
      <a class="card" href="exam.html?subject=${s.slug}">
        <span class="tag">${s.icon} ${escHtml(s.name)}</span>
        <h3>${escHtml(s.name)}</h3>
        <p>${escHtml(s.desc)}</p>
      </a>
    `).join("")
    : '<p class="muted">ไม่พบวิชาที่ตรงกับคำค้นหา</p>';

  /* ── โพสต์ในบอร์ดความคิดเห็น ── */
  const user = getSession();
  const board = user ? createPostBoard({
    listEl: document.getElementById("postResults"),
    user,
    emptyMessage: "ไม่พบโพสต์ที่ตรงกับคำค้นหา",
    onChange: loadPostResults
  }) : null;

  if (!user){
    document.getElementById("loginPrompt").classList.remove("hidden");
  } else {
    loadPostResults();
  }

  async function loadPostResults(){
    const box = document.getElementById("postResults");
    box.innerHTML = '<p class="muted">กำลังโหลด…</p>';
    const res = await apiCall("listPosts", { sort: "new", viewerEmail: user.email });
    if (!res.ok){ box.innerHTML = `<div class="msg bad">${escHtml(res.error || "โหลดไม่สำเร็จ")}</div>`; return; }
    const posts = (res.posts || []).filter(p => {
      if (!qLower) return false;
      const meta = postSubjectMeta(p.subject);
      return p.text.toLowerCase().includes(qLower) ||
             p.name.toLowerCase().includes(qLower) ||
             (meta && meta.name.toLowerCase().includes(qLower));
    });
    board.render(posts);
  }
})();
</script>
</body>
</html>
