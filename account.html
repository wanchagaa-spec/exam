<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ข้อมูลส่วนตัว — ข้อสอบ</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .profilecard{display:flex;gap:18px;align-items:center;justify-content:flex-end;text-align:right;margin-bottom:26px}
  .profilecard .who h1{font-size:22px;margin-bottom:4px}
  .profilecard .pic{flex:none;text-align:center}
</style>
</head>
<body>

<main>
  <section class="section" style="padding-top:56px">
    <div class="wrap" style="max-width:720px;margin:0 auto">

      <div class="profilecard">
        <div class="who">
          <h1 id="hi"></h1>
          <div id="profile" class="muted" style="font-size:14px"></div>
        </div>
        <div class="pic">
          <div id="avatarBox"></div>
          <input type="file" id="avatarInput" accept="image/*" class="hidden">
          <button class="btn s" id="avatarBtn" type="button" style="margin-top:8px;min-height:36px;padding:0 14px;font-size:12.5px">เปลี่ยนรูป</button>
        </div>
      </div>
      <div id="avatarMsg"></div>

      <h2 style="font-size:20px;margin-bottom:14px">โพสต์ของฉัน</h2>
      <p class="muted" style="margin-bottom:16px;font-size:14px">โพสต์ใหม่ได้จากปุ่ม + บน header</p>
      <div id="list"></div>
    </div>
  </section>
</main>

<script src="assets/site.js"></script>
<script src="assets/demo-data.js"></script>
<script>
(function(){
  "use strict";
  renderHeader("account.html");
  renderFooter();

  if (!requireLogin()) return;
  const user = getSession();

  document.getElementById("hi").textContent = user.name;
  document.getElementById("profile").innerHTML =
    `${escHtml(user.email || "")}${user.school ? " · " + escHtml(user.school) : ""}${user.age ? " · อายุ " + escHtml(String(user.age)) + " ปี" : ""}`;

  function renderAvatarBox(){
    document.getElementById("avatarBox").innerHTML = avatarHtml(user, 84);
  }
  renderAvatarBox();

  document.getElementById("avatarBtn").onclick = () => document.getElementById("avatarInput").click();
  document.getElementById("avatarInput").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const msg = document.getElementById("avatarMsg");
    msg.innerHTML = '<p class="muted" style="font-size:13.5px">กำลังอัปโหลด…</p>';
    try {
      const dataUrl = await resizeImageToDataUrl(file, 160);
      const res = await apiCall("updateAvatar", { email: user.email, avatar: dataUrl });
      if (res.ok){
        user.avatar = dataUrl;
        setSession(user);
        renderAvatarBox();
        msg.innerHTML = '<div class="msg ok">เปลี่ยนรูปโปรไฟล์แล้ว</div>';
      } else {
        msg.innerHTML = `<div class="msg bad">${escHtml(res.error || "อัปโหลดไม่สำเร็จ")}</div>`;
      }
    } catch (err) {
      msg.innerHTML = '<div class="msg bad">อ่านไฟล์รูปไม่สำเร็จ ลองใช้รูปอื่น</div>';
    }
    e.target.value = "";
  };

  const board = createPostBoard({
    listEl: document.getElementById("list"),
    user,
    emptyMessage: "ยังไม่มีโพสต์",
    onChange: loadMyPosts
  });

  async function loadMyPosts(){
    const list = document.getElementById("list");
    list.innerHTML = '<p class="muted">กำลังโหลด…</p>';
    const res = await apiCall("listPosts", { authorEmail: user.email, sort: "new", viewerEmail: user.email });
    if (!res.ok){ list.innerHTML = `<div class="msg bad">${escHtml(res.error || "โหลดไม่สำเร็จ")}</div>`; return; }
    board.render(res.posts || []);
  }

  loadMyPosts();
  document.addEventListener("examSitePostCreated", loadMyPosts);
})();
</script>
</body>
</html>
