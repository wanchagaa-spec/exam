<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ข้อมูลส่วนตัว — ข้อสอบ</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .profilecard{display:flex;gap:18px;align-items:center;justify-content:flex-end;text-align:right;margin-bottom:26px}
  .profilecard .who h1{font-size:22px;margin-bottom:4px}
  .profilecard .pic{flex:none;text-align:center}
  .statsline{margin-bottom:18px;font-size:14.5px;color:var(--muted)}
  .tabbar{display:flex;gap:22px;margin-bottom:20px;border-bottom:1px solid var(--line)}
  .tabbtn{background:none;border:none;border-bottom:2px solid transparent;padding:10px 2px;
    font-weight:700;font-size:15px;color:var(--muted);cursor:pointer}
  .tabbtn.on{color:var(--accent);border-bottom-color:var(--accent)}
  .examrow{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:12px}
  .examrow .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
  .examrow .subj{font-weight:700}
  .examrow .when{font-size:13px;color:var(--muted2);margin-top:2px}
  .examrow .score{font-size:14.5px;margin:6px 0}
  .examrow .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted2)}
</style>
</head>
<body>

<main>
  <section class="section" style="padding-top:56px">
    <div class="wrap" style="max-width:720px;margin:0 auto">

      <div class="profilecard">
        <div class="who">
          <h1 id="hi"></h1>
          <div id="profile" class="muted" style="font-size:14px"></div>
        </div>
        <div class="pic">
          <div id="avatarBox"></div>
          <input type="file" id="avatarInput" accept="image/*" class="hidden">
          <button class="btn s" id="avatarBtn" type="button" style="margin-top:8px;min-height:36px;padding:0 14px;font-size:12.5px">เปลี่ยนรูป</button>
        </div>
      </div>
      <div id="avatarMsg"></div>

      <div id="examStats" class="statsline hidden"></div>

      <div class="tabbar">
        <button class="tabbtn on" id="tabBtnHistory" type="button">ประวัติการทำข้อสอบ</button>
        <button class="tabbtn" id="tabBtnPosts" type="button">โพสต์ของฉัน</button>
      </div>

      <div id="tabHistory">
        <div id="historyList"></div>
      </div>
      <div id="tabPosts" class="hidden">
        <p class="muted" style="margin-bottom:16px;font-size:14px">โพสต์ใหม่ได้จากปุ่ม + บน header</p>
        <div id="list"></div>
      </div>
    </div>
  </section>
</main>

<script src="assets/site.js"></script>
<script src="assets/demo-data.js"></script>
<script>
(function(){
  "use strict";
  renderHeader("account.html");
  renderFooter();

  if (!requireLogin()) return;
  const user = getSession();

  document.getElementById("hi").textContent = user.name;
  document.getElementById("profile").innerHTML =
    `${escHtml(user.email || "")}${user.school ? " · " + escHtml(user.school) : ""}${user.age ? " · อายุ " + escHtml(String(user.age)) + " ปี" : ""}`;

  function renderAvatarBox(){
    document.getElementById("avatarBox").innerHTML = avatarHtml(user, 84);
  }
  renderAvatarBox();

  document.getElementById("avatarBtn").onclick = () => document.getElementById("avatarInput").click();
  document.getElementById("avatarInput").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const msg = document.getElementById("avatarMsg");
    msg.innerHTML = '<p class="muted" style="font-size:13.5px">กำลังอัปโหลด…</p>';
    try {
      const dataUrl = await resizeImageToDataUrl(file, 160);
      const res = await apiCall("updateAvatar", { email: user.email, avatar: dataUrl });
      if (res.ok){
        user.avatar = dataUrl;
        setSession(user);
        renderAvatarBox();
        msg.innerHTML = '<div class="msg ok">เปลี่ยนรูปโปรไฟล์แล้ว</div>';
      } else {
        msg.innerHTML = `<div class="msg bad">${escHtml(res.error || "อัปโหลดไม่สำเร็จ")}</div>`;
      }
    } catch (err) {
      msg.innerHTML = '<div class="msg bad">อ่านไฟล์รูปไม่สำเร็จ ลองใช้รูปอื่น</div>';
    }
    e.target.value = "";
  };

  const board = createPostBoard({
    listEl: document.getElementById("list"),
    user,
    emptyMessage: "ยังไม่มีโพสต์",
    onChange: loadMyPosts
  });

  async function loadMyPosts(){
    const list = document.getElementById("list");
    list.innerHTML = '<p class="muted">กำลังโหลด…</p>';
    const res = await apiCall("listPosts", { authorEmail: user.email, sort: "new", viewerEmail: user.email });
    if (!res.ok){ list.innerHTML = `<div class="msg bad">${escHtml(res.error || "โหลดไม่สำเร็จ")}</div>`; return; }
    board.render(res.posts || []);
  }

  loadMyPosts();
  document.addEventListener("examSitePostCreated", loadMyPosts);

  /* ── แท็บ: ประวัติการทำข้อสอบ / โพสต์ของฉัน ── */
  function switchProfileTab(which){
    document.getElementById("tabHistory").classList.toggle("hidden", which !== "history");
    document.getElementById("tabPosts").classList.toggle("hidden", which !== "posts");
    document.getElementById("tabBtnHistory").classList.toggle("on", which === "history");
    document.getElementById("tabBtnPosts").classList.toggle("on", which === "posts");
  }
  document.getElementById("tabBtnHistory").onclick = () => switchProfileTab("history");
  document.getElementById("tabBtnPosts").onclick = () => switchProfileTab("posts");

  function fmtDuration(sec){
    sec = Number(sec) || 0;
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + String(s).padStart(2, "0");
  }

  function examRowHtml(r){
    const meta = postSubjectMeta(r.subject);
    const subjName = meta ? `${meta.icon} ${escHtml(meta.name)}` : escHtml(r.subject);
    return `
    <div class="examrow">
      <div class="top">
        <div>
          <div class="subj">${subjName}</div>
          <div class="when">${postFmtTime(r.timestamp)}</div>
        </div>
        <span class="pill ${r.passed ? "ok" : "no"}">${r.passed ? "ผ่าน" : "ไม่ผ่าน"}</span>
      </div>
      <div class="score">ได้ <b>${r.score}/${r.total}</b> คะแนน (${r.percent}%)</div>
      <div class="foot">
        <span>ใช้เวลา ${fmtDuration(r.usedSeconds)}${r.auto ? " · หมดเวลาอัตโนมัติ" : ""}</span>
        ${meta ? `<a class="btn s" style="min-height:32px;padding:0 12px;font-size:12.5px" href="exam.html?subject=${meta.slug}">ทำใหม่ →</a>` : ""}
      </div>
    </div>`;
  }

  async function loadHistory(){
    const box = document.getElementById("historyList");
    box.innerHTML = '<p class="muted">กำลังโหลด…</p>';
    const res = await apiCall("listMyResults", { email: user.email });
    if (!res.ok){ box.innerHTML = `<div class="msg bad">${escHtml(res.error || "โหลดไม่สำเร็จ")}</div>`; return; }

    const results = res.results || [];
    const statsEl = document.getElementById("examStats");
    if (results.length){
      const avg = Math.round(results.reduce((s, r) => s + r.percent, 0) / results.length);
      statsEl.textContent = `ทำข้อสอบไปแล้ว ${results.length} ครั้ง · คะแนนเฉลี่ย ${avg}%`;
      statsEl.classList.remove("hidden");
    } else {
      statsEl.classList.add("hidden");
    }

    box.innerHTML = results.length
      ? results.map(examRowHtml).join("")
      : '<p class="muted">ยังไม่เคยทำข้อสอบ ไปเลือกวิชาที่ต้องการได้ที่หน้า "รายวิชา"</p>';
  }

  loadHistory();
})();
</script>
</body>
</html>
