<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เนื้อหาการเรียนรู้ — ข้อสอบ</title>
<meta name="description" content="อ่านเนื้อหาแยกตามสาระ พร้อมแบบทดสอบท้ายบทเพื่อเช็คความเข้าใจ">
<link rel="canonical" href="https://wanchagaa-spec.github.io/exam/learn.html">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* ── การ์ด "โครงสร้างเนื้อหา" — ลิสต์สาระ/บทเรียนแบบเอกสารโครงสร้างข้อสอบ ── */
  .structcard{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--bg0)}
  .structhead{background:var(--holo);color:var(--accent-ink);font-weight:800;font-size:16px;padding:14px 22px}
  .structintro{padding:16px 22px;font-weight:700;font-size:15px;border-bottom:1px solid var(--line)}
  .structsection{border-bottom:1px solid var(--line)}
  .structsection:last-child{border-bottom:none}
  .structsection-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    padding:12px 22px;background:rgba(255,111,176,.07);font-weight:700;color:var(--accent-ink);font-size:15px}
  .structsection-head .cnt{font-size:12.5px;font-weight:700;color:var(--muted2);white-space:nowrap}
  .topiclist{padding:6px 12px}
  .topiclist a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);
    font-size:14.5px;color:var(--ink)}
  .topiclist a:hover{background:var(--card)}
  .topiclist .num{flex:none;color:var(--muted2);font-weight:700;min-width:26px}
  .topiclist .title{flex:1}
  .topiclist .check{flex:none;font-size:17px}
</style>
</head>
<body>

<main>
  <section class="hero" style="padding-bottom:16px">
    <div class="wrap">
      <span class="eyebrow" id="eyebrow">เนื้อหาการเรียนรู้</span>
      <h1 id="pageTitle">กำลังโหลด…</h1>
      <p class="lead" id="pageDesc"></p>
    </div>
  </section>

  <section class="section" style="padding-top:10px">
    <div class="wrap" style="max-width:960px;margin:0 auto">
      <div class="learnlayout">
        <nav class="subjectnav" id="subjectNav"></nav>
        <div id="strandList"><p class="muted">กำลังโหลด…</p></div>
      </div>
    </div>
  </section>
</main>

<script src="assets/site.js"></script>
<script src="assets/demo-data.js"></script>
<script>
(function(){
  "use strict";
  if (!requireLogin()) return;

  renderHeader("learn.html");
  renderFooter();

  const user = getSession();
  const params = new URLSearchParams(location.search);
  // ไม่ระบุวิชามา (เช่นกดไอคอน 📖 บน header ตรงๆ) ให้ตั้งต้นที่วิชาแรกที่เปิดอยู่ แล้วสลับวิชาอื่นได้จาก sidebar
  const slug = params.get("subject") || (visibleSubjects()[0] && visibleSubjects()[0].slug) || "";
  const subject = SUBJECTS.find(s => s.slug === slug);

  document.getElementById("subjectNav").innerHTML = subjectNavHtml(slug);
  renderSidebar(slug);

  if (!subject){
    document.getElementById("pageTitle").textContent = "ไม่พบวิชานี้";
    document.getElementById("strandList").innerHTML = '<p class="muted">กรุณาเลือกวิชาจากหน้ารายวิชาอีกครั้ง</p>';
  } else {
    document.title = "เรียนเนื้อหา: " + subject.name + " — ข้อสอบ";
    document.getElementById("eyebrow").textContent = subject.icon + " " + subject.name;
    document.getElementById("pageTitle").textContent = "เนื้อหาการเรียนรู้";
    document.getElementById("pageDesc").textContent = "อ่านเนื้อหาแต่ละสาระ ทำแบบทดสอบท้ายบทให้ถูกครบทุกข้อ ระบบจะทำเครื่องหมาย “อ่านแล้ว” ให้อัตโนมัติ";
    loadLessons();
  }

  async function loadLessons(){
    const res = await apiCall("listLessons", { subject: subject.slug, email: user.email });
    const box = document.getElementById("strandList");
    if (!res.ok){ box.innerHTML = `<div class="msg bad">${escHtml(res.error || "โหลดไม่สำเร็จ")}</div>`; return; }

    const strands = SUBJECT_STRANDS[subject.slug] || [];
    const byStrand = {};
    (res.lessons || []).forEach(l => { (byStrand[l.strand] = byStrand[l.strand] || []).push(l); });

    const usedStrands = strands.filter(s => (byStrand[s] || []).length);
    // เผื่อมีบทเรียนที่แท็กสาระไม่ตรงกับ SUBJECT_STRANDS ปัจจุบัน (เช่นแก้ชื่อสาระทีหลัง) ให้โชว์ท้ายสุดด้วย ไม่ตกหล่น
    Object.keys(byStrand).forEach(s => { if (!usedStrands.includes(s)) usedStrands.push(s); });

    if (!usedStrands.length){
      box.innerHTML = '<p class="muted">ยังไม่มีเนื้อหาสำหรับวิชานี้ กลับมาดูใหม่ภายหลังนะ</p>';
      return;
    }

    const sections = usedStrands.map((strand, i) => {
      const lessons = byStrand[strand];
      const doneCount = lessons.filter(l => l.completed).length;
      return `
        <div class="structsection">
          <div class="structsection-head">
            <span>ส่วนที่ ${i + 1} : ${escHtml(strand)}</span>
            <span class="cnt">อ่านแล้ว ${doneCount}/${lessons.length}</span>
          </div>
          <div class="topiclist">
            ${lessons.map((l, j) => `
              <a href="lesson.html?id=${encodeURIComponent(l.id)}&subject=${encodeURIComponent(subject.slug)}">
                <span class="num">${j + 1})</span>
                <span class="title">${escHtml(l.title)}</span>
                <span class="check">${l.completed ? "✅" : "⬜"}</span>
              </a>`).join("")}
          </div>
        </div>`;
    }).join("");

    box.innerHTML = `
      <div class="structcard">
        <div class="structhead">📖 โครงสร้างเนื้อหา</div>
        <p class="structintro">วิชา${escHtml(subject.name)} มีเนื้อหาทั้งหมด ${usedStrands.length} สาระ ดังนี้</p>
        ${sections}
      </div>`;
  }
})();
</script>
</body>
</html>
