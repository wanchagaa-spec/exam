<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รายวิชา / ทำข้อสอบ — ข้อสอบ</title>
<meta name="description" content="รายชื่อวิชาที่เปิดให้ทดลองทำข้อสอบ สุ่มข้อสอบจากคลังใหญ่ พร้อมจับเวลา">
<link rel="canonical" href="https://wanchagaa-spec.github.io/exam/subjects.html">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<main>
  <section class="hero" style="padding-bottom:20px">
    <div class="wrap">
      <span class="eyebrow">รายชื่อวิชา</span>
      <h1>เลือกวิชาที่จะทดลองทำ</h1>
      <p class="lead">แต่ละวิชามีคลังข้อสอบจำนวนมาก ระบบจะสุ่มข้อสอบชุดใหม่ให้ทุกครั้งที่กดเริ่มทำ</p>
    </div>
  </section>

  <section class="section" style="padding-top:10px">
    <div class="wrap">
      <div class="grid c3" id="subjectList"></div>
    </div>
  </section>
</main>

<script src="assets/site.js"></script>
<script src="assets/demo-data.js"></script>
<script>
  renderHeader("subjects.html");
  renderFooter();

  document.getElementById("subjectList").innerHTML = visibleSubjects().map(s => `
    <div class="card">
      <span class="tag">${s.icon} <span id="stat_${s.slug}">กำลังโหลด…</span></span>
      <h3>${s.name}</h3>
      <p>${s.desc}</p>
      <div class="meta"><span>⏱ ${s.minutes} นาที</span></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
        <a class="btn s" href="learn.html?subject=${s.slug}" style="flex:1">📖 เรียนเนื้อหา</a>
        <a class="btn p" href="exam.html?subject=${s.slug}" style="flex:1">📝 ทำข้อสอบ</a>
      </div>
    </div>
  `).join("");

  visibleSubjects().forEach(async s => {
    const sum = await blueprintSummary(s.slug);
    const el = document.getElementById("stat_" + s.slug);
    if (!el) return;
    el.textContent = sum.total ? (sum.sections.length + " ส่วน • " + sum.total + " ข้อ") : "ยังไม่ได้ตั้งโครงสร้างข้อสอบ";
  });
</script>
</body>
</html>
