<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รายวิชา / ทำข้อสอบ — ข้อสอบ</title>
<meta name="description" content="รายชื่อวิชาที่เปิดให้ทดลองทำข้อสอบ สุ่มข้อสอบจากคลังใหญ่ พร้อมจับเวลา">
<link rel="canonical" href="https://wanchagaa-spec.github.io/exam/subjects.html">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<main>
  <section class="hero" style="padding-bottom:20px">
    <div class="wrap">
      <span class="eyebrow">รายชื่อวิชา</span>
      <h1>เลือกวิชาที่จะทดลองทำ</h1>
      <p class="lead">แต่ละวิชามีคลังข้อสอบจำนวนมาก ระบบจะสุ่มข้อสอบชุดใหม่ให้ทุกครั้งที่กดเริ่มทำ</p>
    </div>
  </section>

  <section class="section" style="padding-top:10px">
    <div class="wrap">
      <div id="readyWrap">
        <p class="muted" id="loadingNote">กำลังโหลดรายวิชา…</p>
        <div class="grid c3" id="subjectList"></div>
      </div>

      <div id="pendingWrap" class="hidden" style="margin-top:38px">
        <h2 style="font-size:19px;margin-bottom:4px">ยังไม่เปิดให้ทำข้อสอบ</h2>
        <p class="muted" style="margin-bottom:16px;font-size:14.5px">วิชาเหล่านี้อยู่ระหว่างเตรียมคลังข้อสอบ เปิดให้ทำทันทีที่มีข้อสอบพร้อม</p>
        <div class="grid c3" id="pendingList"></div>
      </div>
    </div>
  </section>
</main>

<script src="assets/site.js"></script>
<script src="assets/demo-data.js"></script>
<script>
  renderHeader("subjects.html");
  renderFooter();

  /* แยก 2 กลุ่มตามจำนวนข้อในคลังจริง แล้วค่อยวาดการ์ด (ต้องรอผลจากเซิร์ฟเวอร์ก่อนถึงจะรู้ว่าวิชาไหนพร้อม) */
  (async function renderSubjects(){
    const { ready, pending, map } = await splitSubjectsByReadiness(visibleSubjects());

    document.getElementById("loadingNote").classList.add("hidden");
    document.getElementById("subjectList").innerHTML = ready.length
      ? ready.map(s => subjectCardHtml(s, map.get(s.slug))).join("")
      : '<p class="muted">ยังไม่มีวิชาไหนเปิดให้ทำข้อสอบตอนนี้ กลับมาดูใหม่ได้เร็ว ๆ นี้</p>';

    if (pending.length){
      document.getElementById("pendingList").innerHTML = pending.map(s => subjectCardHtml(s, map.get(s.slug))).join("");
      document.getElementById("pendingWrap").classList.remove("hidden");
    }
  })();
</script>
</body>
</html>
