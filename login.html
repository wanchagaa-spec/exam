<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เข้าสู่ระบบ — ข้อสอบ</title>
<link rel="canonical" href="https://wanchagaa-spec.github.io/exam/login.html">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<main>
  <section class="section" style="padding-top:56px">
    <div class="wrap narrow">
      <div class="auth-card">
        <h1>เข้าสู่ระบบ</h1>
        <p class="sub">เข้าสู่ระบบเพื่อเก็บประวัติการทำข้อสอบของคุณ</p>
        <div id="msg"></div>
        <form id="loginForm">
          <div class="field">
            <label for="email">อีเมล</label>
            <input type="email" id="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="p">รหัสผ่าน</label>
            <input type="password" id="p" autocomplete="current-password" required>
          </div>
          <button class="btn p block" type="submit">เข้าสู่ระบบ</button>
        </form>
        <p class="switch">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></p>
      </div>
    </div>
  </section>
</main>

<script src="assets/site.js"></script>
<script src="assets/demo-data.js"></script>
<script>
  renderHeader("login.html");
  renderFooter();

  const params = new URLSearchParams(location.search);

  document.getElementById("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("p").value;
    const btn = e.target.querySelector("button");
    btn.disabled = true; btn.textContent = "กำลังเข้าสู่ระบบ…";

    const res = await apiCall("login", { email, password });

    if (res.ok){
      setSession({ email: res.email || email, name: res.name || email, age: res.age, school: res.school, avatar: res.avatar || "" });
      location.href = params.get("next") || "index.html";
    } else {
      document.getElementById("msg").innerHTML = `<div class="msg bad">${escHtml(res.error || "เข้าสู่ระบบไม่สำเร็จ")}</div>`;
      btn.disabled = false; btn.textContent = "เข้าสู่ระบบ";
    }
  };
</script>
</body>
</html>
