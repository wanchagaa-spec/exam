<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทำข้อสอบ — ข้อสอบ</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  /* ── ส่วนเสริมเฉพาะหน้าทำข้อสอบ (ธีมเดียวกับ style.css) ── */
  .fillbox{width:100%;min-height:var(--tap);padding:12px 15px;font:inherit;font-size:16px;
    border:1.5px solid var(--line);border-radius:var(--r);background:#ffffff;color:var(--ink)}
  .fillbox:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(215,97,255,.22)}
  .examhead{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:24px 22px;margin-bottom:16px}
  .rule{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15.5px}
  .rule:first-of-type{border-top:none}
  .rule b{flex:none;width:150px;color:var(--muted)}

  .bar{position:sticky;top:0;z-index:40;background:var(--bg1);border-bottom:1px solid var(--line);
    padding:12px 16px;display:flex;align-items:center;gap:14px}
  .bar .n{font-size:14px;color:var(--muted)}
  .clock{margin-left:auto;font-size:21px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
  .clock.hot{color:var(--danger);animation:tick 1s steps(2) infinite}
  @keyframes tick{50%{opacity:.4}}
  .prog{height:5px;background:rgba(0,0,0,.08);position:sticky;top:47px;z-index:39}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}

  .q{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 18px;margin-bottom:14px}
  .q.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(255,107,107,.18)}
  .qh{display:flex;gap:11px;margin-bottom:14px}
  .qn{flex:none;width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;font-size:14px;font-weight:800;display:grid;place-items:center}
  .qt{font-weight:600;line-height:1.55;padding-top:2px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;align-items:center;gap:12px;min-height:var(--tap);padding:10px 15px;
    border:1.5px solid var(--line);border-radius:var(--r);background:#ffffff;cursor:pointer;
    line-height:1.45;transition:.14s}
  .opt:hover{border-color:var(--accent)}
  .opt input{position:absolute;opacity:0;width:1px;height:1px}
  .mk{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;
    display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted);transition:.14s}
  .opt.on{border-color:var(--accent);background:rgba(215,97,255,.12)}
  .opt.on .mk{border-color:var(--accent);background:var(--accent);color:#fff}
  .opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}

  .foot{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding:13px 16px calc(13px + env(safe-area-inset-bottom))}
  .fin{max-width:640px;margin:0 auto}
  #note{font-size:14px;text-align:center;margin-top:8px;color:var(--muted);min-height:20px}
  #note.bad{color:var(--danger);font-weight:600}

  .mask{position:fixed;inset:0;z-index:60;background:rgba(10,4,20,.72);display:none;place-items:center;padding:20px}
  .mask.on{display:grid}
  .modal{background:var(--bg1);border:1px solid var(--line);border-radius:16px;padding:26px 22px;max-width:400px;width:100%;text-align:center}
  .modal h3{font-size:21px;margin-bottom:8px}
  .modal p{color:var(--muted);font-size:15.5px;line-height:1.6;margin-bottom:20px}
  .modal .rowb{display:grid;gap:9px}

  .ring{width:150px;height:150px;margin:0 auto 18px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800}
  .verdict{text-align:center;margin-bottom:22px}
  .verdict h2{font-size:27px;margin-bottom:5px}
  .pill{display:inline-block;padding:5px 15px;border-radius:20px;font-weight:800;font-size:14px;margin-bottom:12px}
  .pill.ok{background:rgba(74,222,128,.15);color:var(--ok)}
  .pill.no{background:rgba(255,107,107,.15);color:var(--danger)}
  .rev{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:11px}
  .rev.r{border-left:4px solid var(--ok)}
  .rev.w{border-left:4px solid var(--danger)}
  .rev .t{font-weight:600;margin-bottom:8px;line-height:1.5}
  .rev .l{font-size:14.5px;color:var(--muted);margin-top:4px}
  .rev .l b{color:var(--ink);font-weight:600}
  .mid{max-width:640px;margin:0 auto;padding:24px 16px 120px}
</style>
</head>
<body>

<main id="app">
  <p class="wrap muted" style="padding:40px 0">กำลังโหลด…</p>
</main>

<script src="assets/site.js"></script>
<script src="assets/demo-data.js"></script>
<script>
(function(){
  "use strict";
  if (!requireLogin()) return;

  const params = new URLSearchParams(location.search);
  const slug = params.get("subject");
  const subject = SUBJECTS.find(s => s.slug === slug);
  const app = document.getElementById("app");

  if (!subject){
    app.innerHTML = '<div class="wrap" style="padding:60px 0;text-align:center">' +
      '<h1 style="margin-bottom:12px">ไม่พบวิชานี้</h1>' +
      '<a class="btn p" href="subjects.html">กลับไปเลือกวิชา</a></div>';
    renderHeader(); renderFooter();
    return;
  }

  document.title = subject.name + " — ทำข้อสอบ";

  const PASS_PERCENT = 60;
  const CONFIRM_BEFORE_SUBMIT = true;
  const user = getSession();
  const esc = escHtml;
  const LET = ["ก","ข","ค","ง","จ","ฉ"];

  let questions = [], sessionId = null, left = 0, timer = null, sent = false, demoAnswerKey = null;
  const ans = {};

  app.innerHTML = `
    <div class="mid" id="s1">
      <div class="examhead">
        <span class="eyebrow">${subject.icon} ${esc(subject.name)}</span>
        <h1 style="margin:10px 0 4px">เตรียมตัวก่อนเริ่มทำ</h1>
        <p class="muted">คลังข้อสอบวิชานี้มี ${subject.bank} ข้อ ระบบจะสุ่มมาให้ ${subject.draw} ข้อในการทำครั้งนี้</p>
      </div>
      <div class="examhead">
        <div class="rule"><b>จำนวนข้อ</b><span>${subject.draw} ข้อ (สุ่มจากคลัง ${subject.bank} ข้อ)</span></div>
        <div class="rule"><b>เวลา</b><span>${subject.minutes} นาที หมดเวลาระบบจะส่งอัตโนมัติ</span></div>
        <div class="rule"><b>เกณฑ์ผ่าน</b><span>${PASS_PERCENT}%</span></div>
        <div class="rule"><b>จำนวนครั้ง</b><span>ทำได้หลายครั้งเพื่อฝึกฝน แต่ละครั้งได้ข้อสอบชุดใหม่</span></div>
      </div>
      <button class="btn p block" id="start" style="margin-top:6px">เริ่มทำแบบทดสอบ</button>
      <p id="n1" class="muted" style="text-align:center;margin-top:10px"></p>
    </div>
  `;
  renderHeader(); renderFooter();

  document.getElementById("start").onclick = startExam;

  async function startExam(){
    const btn = document.getElementById("start");
    btn.disabled = true; btn.textContent = "กำลังเตรียมข้อสอบ…";

    if (APP.demoMode){
      const bank = demoBankLoad(subject.slug);
      if (bank.length){
        const chosen = shuffleArr(bank.slice()).slice(0, Math.min(subject.draw, bank.length));
        demoAnswerKey = {};
        chosen.forEach(q => { demoAnswerKey[q.id] = { type: q.type, answer: q.answer, score: q.score || 1, note: q.note || "" }; });
        questions = chosen.map(q => ({ id: q.id, type: q.type, text: q.text, options: q.options }));
      } else {
        questions = genDemoQuestions(subject);
        demoAnswerKey = null;
      }
      sessionId = "demo";
    } else {
      try {
        const url = APP.endpoint + "?action=exam&subject=" + encodeURIComponent(subject.slug) +
          "&count=" + subject.draw + "&token=" + encodeURIComponent(APP.token);
        const r = await fetch(url);
        const res = await r.json();
        if (!res.ok) throw new Error(res.error || "โหลดข้อสอบไม่สำเร็จ");
        questions = res.questions;
        sessionId = res.sessionId;
      } catch(err){
        document.getElementById("n1").className = "bad";
        document.getElementById("n1").textContent = "โหลดข้อสอบไม่สำเร็จ ลองใหม่อีกครั้ง";
        btn.disabled = false; btn.textContent = "เริ่มทำแบบทดสอบ";
        return;
      }
    }

    buildExamScreen();
    startClock();
  }

  function genDemoQuestions(sub){
    const n = sub.draw;
    const list = [];
    for (let i = 1; i <= n; i++){
      list.push({
        id: "d" + i,
        type: "mc",
        text: "ตัวอย่างข้อที่ " + i + " ของวิชา" + sub.name + " (รอโจทย์จริงจากผู้ดูแลเว็บไซต์)",
        options: ["ตัวเลือก ก","ตัวเลือก ข","ตัวเลือก ค","ตัวเลือก ง"]
      });
    }
    return list;
  }

  function buildExamScreen(){
    app.innerHTML = `
      <div class="bar">
        <span class="n">${esc(user.name)} · ${esc(subject.name)}</span>
        <span class="clock" id="clock">—</span>
      </div>
      <div class="prog"><i id="pg"></i></div>
      <div class="mid" id="qs"></div>
      <div class="foot"><div class="fin">
        <button class="btn p block" id="send">ส่งคำตอบ</button>
        <div id="note"></div>
      </div></div>
      <div class="mask" id="mask">
        <div class="modal">
          <h3 id="m-t"></h3>
          <p id="m-b"></p>
          <div class="rowb">
            <button class="btn p" id="m-ok"></button>
            <button class="btn s" id="m-no">ย้อนกลับ</button>
          </div>
        </div>
      </div>
    `;

    const box = document.getElementById("qs");
    questions.forEach((q, i) => {
      const c = document.createElement("div");
      c.className = "q";
      c.id = "c_" + q.id;
      c.innerHTML = '<div class="qh"><span class="qn">' + (i+1) + '</span><div class="qt">' + esc(q.text) + "</div></div>";
      c.appendChild(field(q));
      box.appendChild(c);
    });
    updateProgress();
    renderMath(box);

    document.getElementById("send").onclick = onSend;
  }

  function field(q){
    if (q.type === "fill"){
      const i = document.createElement("input");
      i.type = "text";
      i.className = "fillbox";
      i.placeholder = "พิมพ์คำตอบ";
      i.setAttribute("aria-label", q.text);
      i.oninput = () => {
        ans[q.id] = i.value.trim();
        document.getElementById("c_" + q.id).classList.remove("err");
        updateProgress();
      };
      return i;
    }

    const list = q.options || ["ถูก","ผิด"];
    const w = document.createElement("div");
    w.className = "opts";
    w.setAttribute("role","radiogroup");
    w.setAttribute("aria-label", q.text);
    list.forEach((o, i) => {
      const lab = document.createElement("label");
      lab.className = "opt";
      lab.innerHTML = '<input type="radio" name="' + q.id + '" value="' + esc(o) + '">' +
        '<span class="mk">' + LET[i] + '</span><span>' + esc(o) + '</span>';
      const inp = lab.querySelector("input");
      inp.onchange = () => {
        ans[q.id] = inp.value;
        [...w.children].forEach(x => x.classList.remove("on"));
        lab.classList.add("on");
        document.getElementById("c_" + q.id).classList.remove("err");
        updateProgress();
      };
      w.appendChild(lab);
    });
    return w;
  }

  const done = q => ans[q.id] !== undefined && ans[q.id] !== "";
  function updateProgress(){
    const n = questions.filter(done).length;
    document.getElementById("pg").style.width = (n / questions.length * 100) + "%";
  }

  function startClock(){
    left = subject.minutes * 60;
    showClock();
    timer = setInterval(() => {
      left--;
      showClock();
      if (left <= 0){ clearInterval(timer); submit(true); }
    }, 1000);
  }
  function showClock(){
    const m = Math.floor(left/60), s = left % 60;
    const el = document.getElementById("clock");
    el.textContent = m + ":" + String(s).padStart(2,"0");
    el.classList.toggle("hot", left <= 60);
  }

  function modal(t, b, okTxt, fn){
    document.getElementById("m-t").textContent = t;
    document.getElementById("m-b").textContent = b;
    document.getElementById("m-ok").textContent = okTxt;
    document.getElementById("mask").classList.add("on");
    document.getElementById("m-ok").onclick = () => { document.getElementById("mask").classList.remove("on"); fn(); };
    document.getElementById("m-no").onclick = () => document.getElementById("mask").classList.remove("on");
  }

  function onSend(){
    const miss = questions.filter(q => !done(q));
    if (miss.length){
      miss.forEach(q => document.getElementById("c_" + q.id).classList.add("err"));
      document.getElementById("note").className = "bad";
      document.getElementById("note").textContent = "ยังไม่ได้ตอบ " + miss.length + " ข้อ";
      document.getElementById("c_" + miss[0].id).scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }
    if (CONFIRM_BEFORE_SUBMIT){
      modal("ยืนยันการส่งคำตอบ", "ส่งแล้วจะแก้ไขไม่ได้ ตรวจทานเรียบร้อยแล้วใช่หรือไม่", "ยืนยัน ส่งคำตอบ", () => submit(false));
    } else submit(false);
  }

  async function submit(auto){
    if (sent) return;
    sent = true;
    if (timer) clearInterval(timer);
    document.getElementById("mask").classList.remove("on");

    const btn = document.getElementById("send");
    btn.disabled = true;
    btn.textContent = auto ? "หมดเวลา กำลังส่ง…" : "กำลังส่ง…";

    if (APP.demoMode){
      await new Promise(r => setTimeout(r, 700));
      const detail = {};
      let score = 0, total = 0;

      if (demoAnswerKey){
        // มีข้อสอบจริงที่แอดมินเพิ่มไว้ผ่าน admin.html — ตรวจให้คะแนนจริงในเครื่อง
        questions.forEach(q => {
          const k = demoAnswerKey[q.id];
          const pt = k.score || 1;
          total += pt;
          const right = answerMatches(k.type, ans[q.id], k.answer);
          if (right) score += pt;
          detail[q.id] = { correct: right, answer: k.answer, note: k.note || "" };
        });
      } else {
        // ยังไม่มีข้อสอบจริงในคลัง — จำลองผลให้ดูหน้าตาเท่านั้น
        questions.forEach((q,i) => {
          detail[q.id] = { correct: i % 3 !== 0, answer: "(โหมดตัวอย่างไม่มีเฉลยจริง — เพิ่มข้อสอบผ่านหน้าแอดมินก่อน)", note: "โหมดตัวอย่าง ยังไม่ได้เชื่อมระบบตรวจจริง" };
        });
        total = questions.length;
        score = Math.round(questions.length * 0.7);
      }

      const percent = total ? Math.round(score/total*100) : 0;
      render({ ok:true, score, total, percent, passed: percent >= PASS_PERCENT, detail });
      return;
    }

    const payload = {
      token: APP.token,
      action: "submitExam",
      subject: subject.slug,
      sessionId,
      identity: { name: user.name, username: user.username },
      answers: ans,
      meta: { used: subject.minutes*60 - Math.max(left,0), auto: !!auto }
    };

    try {
      const r = await fetch(APP.endpoint, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const res = await r.json();
      if (!res.ok) throw new Error(res.error || "ส่งไม่สำเร็จ");
      render(res);
    } catch(err){
      sent = false;
      btn.disabled = false;
      btn.textContent = "ลองส่งอีกครั้ง";
      if (subject.minutes && left > 0) timer = setInterval(() => { left--; showClock(); if (left<=0){clearInterval(timer); submit(true);} }, 1000);
      document.getElementById("note").className = "bad";
      document.getElementById("note").textContent = "ส่งไม่สำเร็จ ตรวจสัญญาณอินเทอร์เน็ตแล้วกดส่งใหม่";
    }
  }

  function render(res){
    const pct = res.percent, pass = res.passed;
    const col = pass ? "var(--ok)" : "var(--danger)";
    const dash = 2 * Math.PI * 64;

    let h = '<div class="q">' +
      '<div class="ring"><svg width="150" height="150">' +
      '<circle cx="75" cy="75" r="64" fill="none" stroke="rgba(0,0,0,.1)" stroke-width="11"/>' +
      '<circle cx="75" cy="75" r="64" fill="none" stroke="' + col + '" stroke-width="11" stroke-linecap="round" ' +
      'stroke-dasharray="' + dash + '" stroke-dashoffset="' + (dash * (1 - pct/100)) + '"/></svg>' +
      '<div class="val" style="color:' + col + '">' + pct + '%</div></div>' +
      '<div class="verdict"><span class="pill ' + (pass ? "ok" : "no") + '">' + (pass ? "ผ่านเกณฑ์" : "ยังไม่ผ่านเกณฑ์") + '</span>' +
      '<h2>' + res.score + ' / ' + res.total + ' คะแนน</h2>' +
      '<p class="muted">เกณฑ์ผ่าน ' + PASS_PERCENT + '%</p></div></div>';

    h += '<h3 style="margin:22px 0 12px;font-size:18px">เฉลยรายข้อ</h3>';
    questions.forEach((q, i) => {
      const d = res.detail && res.detail[q.id];
      if (!d) return;
      const answerDisplay = String(d.answer || "").split("|").join(" หรือ ");
      h += '<div class="rev ' + (d.correct ? "r" : "w") + '">' +
        '<div class="t">' + (i+1) + '. ' + esc(q.text) + '</div>' +
        '<div class="l">คำตอบของคุณ: <b>' + esc(ans[q.id]) + '</b></div>' +
        (d.correct ? '' : '<div class="l">คำตอบที่ถูก: <b>' + esc(answerDisplay) + '</b></div>') +
        (d.note ? '<div class="l">' + esc(d.note) + '</div>' : '') + '</div>';
    });

    h += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">' +
      '<a class="btn p" href="exam.html?subject=' + subject.slug + '">ทำข้อสอบชุดใหม่</a>' +
      '<a class="btn s" href="subjects.html">เลือกวิชาอื่น</a></div>';

    app.innerHTML = '<div class="mid" style="padding-top:24px">' + h + '</div>';
    renderMath(app);
    window.scrollTo(0,0);
  }
})();
</script>
</body>
</html>
