<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทำข้อสอบ — ข้อสอบ</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  /* ── ส่วนเสริมเฉพาะหน้าทำข้อสอบ (ธีมเดียวกับ style.css) ── */
  .fillbox{width:auto;min-width:130px;max-width:220px;min-height:44px;padding:8px 12px;font:inherit;font-size:16px;
    border:1.5px solid var(--line);border-radius:var(--r);background:#ffffff;color:var(--ink)}
  .fillbox:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,111,176,.22)}
  .examhead{background-color:#fffdf3;
    background-image:repeating-linear-gradient(#fffdf3 0,#fffdf3 33px,rgba(120,150,200,.4) 34px);
    border:1px solid transparent;border-radius:var(--r-lg);
    padding:24px 22px 24px 40px;margin-bottom:16px;position:relative;box-shadow:0 3px 14px rgba(0,0,0,.09)}
  .examhead::before{content:"";position:absolute;left:28px;top:0;bottom:0;width:1px;background:rgba(217,90,90,.35)}
  .rule{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15.5px}
  .rule:first-of-type{border-top:none}
  .rule b{flex:none;width:150px;color:var(--muted)}

  .bar{position:sticky;top:0;z-index:40;background:var(--bg1);border-bottom:1px solid var(--line);
    padding:12px 16px;display:flex;align-items:center;gap:14px}
  .bar .n{font-size:14px;color:var(--muted)}
  .clock{margin-left:auto;font-size:21px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
  .clock.hot{color:var(--danger);animation:tick 1s steps(2) infinite}
  @keyframes tick{50%{opacity:.4}}
  .prog{height:5px;background:rgba(0,0,0,.08);position:sticky;top:47px;z-index:39}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}

  .q{background-color:#fffdf3;
    background-image:repeating-linear-gradient(#fffdf3 0,#fffdf3 33px,rgba(120,150,200,.4) 34px);
    border:1px solid transparent;border-radius:var(--r-lg);padding:20px 18px 20px 38px;margin-bottom:14px;
    position:relative;box-shadow:0 3px 14px rgba(0,0,0,.09)}
  .q::before{content:"";position:absolute;left:26px;top:0;bottom:0;width:1px;background:rgba(217,90,90,.35)}
  .q.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(255,107,107,.18)}
  .qh{display:flex;gap:11px;margin-bottom:14px}
  .qn{flex:none;width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;font-size:14px;font-weight:800;display:grid;place-items:center}
  .qt{font-weight:600;line-height:1.55;padding-top:2px;font-family:'Mali','Sarabun',cursive;font-size:17.5px;color:#4a3f2f}
  .opts{display:flex;flex-direction:column;gap:2px}
  .opt{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 8px;
    border-radius:var(--r);cursor:pointer;line-height:1.4;transition:.14s}
  .opt:hover{background:rgba(0,0,0,.04)}
  .opt input{position:absolute;opacity:0;width:1px;height:1px}
  .mk{flex:none;width:22px;height:22px;border:2px solid var(--line);border-radius:50%;
    display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted);transition:.14s}
  .opt.on{background:rgba(255,111,176,.1)}
  .opt.on .mk{border-color:var(--accent);background:var(--accent);color:#fff}
  .opt:focus-within{outline:3px solid var(--accent);outline-offset:2px;border-radius:var(--r)}

  .foot{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding:13px 16px calc(13px + env(safe-area-inset-bottom))}
  .fin{max-width:640px;margin:0 auto}
  #note{font-size:14px;text-align:center;margin-top:8px;color:var(--muted);min-height:20px}
  #note.bad{color:var(--danger);font-weight:600}

  .mask{position:fixed;inset:0;z-index:60;background:rgba(10,4,20,.72);display:none;place-items:center;padding:20px}
  .mask.on{display:grid}
  .modal{background:var(--bg1);border:1px solid var(--line);border-radius:16px;padding:26px 22px;max-width:400px;width:100%;text-align:center}
  .modal h3{font-size:21px;margin-bottom:8px}
  .modal p{color:var(--muted);font-size:15.5px;line-height:1.6;margin-bottom:20px}
  .modal .rowb{display:grid;gap:9px}

  .ring{width:150px;height:150px;margin:0 auto 18px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800}
  .verdict{text-align:center;margin-bottom:22px}
  .verdict h2{font-size:27px;margin-bottom:5px}
  .verdict .pill{margin-bottom:12px}
  .rev{background:transparent;border:1px solid transparent;border-radius:var(--r);padding:16px 18px;margin-bottom:11px}
  .rev.r{border-left:4px solid var(--ok)}
  .rev.w{border-left:4px solid var(--danger)}
  .rev .t{font-weight:600;margin-bottom:8px;line-height:1.5}
  .rev .l{font-size:14.5px;color:var(--muted);margin-top:4px}
  .rev .l b{color:var(--ink);font-weight:600}
  .mid{max-width:640px;margin:0 auto;padding:24px 16px 120px}
  .sechead{font-weight:800;font-size:15.5px;color:var(--accent);margin:26px 0 12px;
    padding-top:18px;border-top:2px solid var(--line)}
  .sechead:first-child{margin-top:0;padding-top:0;border-top:none}

  /* ── กระดาษทด — หน้าต่างลอยลากย้าย/ปรับขนาดได้ หรือแบ่งครึ่งจอกับข้อสอบ วาดด้วยสไตลัส/เมาส์ (นิ้วไว้เลื่อนหน้าแทน)
     เป็นหน้ากระดาษยาว (900×2600px) เลื่อนขึ้นลงได้ ซูมเข้า-ออกได้ ไม่ใช่ส่วนหนึ่งของคำตอบที่ส่งตรวจ ── */
  .scratchfab{position:fixed;right:16px;bottom:118px;z-index:41;width:52px;height:52px;border-radius:50%;
    background:transparent;color:var(--accent-ink);border:none;font-size:22px;box-shadow:none;
    cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.72;transition:opacity .15s}
  .scratchfab:hover{opacity:1}
  .scratchfab:active{transform:scale(.95)}

  .scratchpanel{position:fixed;z-index:45;background:#fffef6;border:1.5px solid var(--line);border-radius:var(--r-lg);
    box-shadow:0 14px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden;
    min-width:260px;min-height:240px}
  .scratchpanel.hidden{display:none}
  .scratchpanel.split{border-radius:0;box-shadow:-10px 0 30px rgba(0,0,0,.2);
    right:0 !important;bottom:0 !important;left:auto !important;width:50vw !important}

  .scratchbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);
    background:var(--card);flex-wrap:wrap;flex:none;cursor:move;user-select:none;touch-action:none}
  .scratchbar .lbl{font-weight:700;font-size:13px;color:var(--muted);margin-right:2px}
  .scratchbtn{flex:none;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:#fff;
    cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0}
  .scratchbtn.on{border-color:var(--accent);background:rgba(255,111,176,.15)}
  .swatch{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .swatch.on{border-color:var(--accent-ink)}
  .zoomlabel{flex:none;font-size:11.5px;font-weight:700;color:var(--muted2);width:36px;text-align:center}

  .scratchscroll{flex:1;overflow:auto;background:#efece0;position:relative}
  #scratchCanvas{display:block;transform-origin:0 0;background:#fffef6;box-shadow:0 0 0 1px rgba(0,0,0,.05);cursor:crosshair}

  .scratchresize{position:absolute;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;z-index:2;
    background:linear-gradient(135deg,transparent 50%,var(--muted2) 50%);opacity:.55;touch-action:none}
  .scratchpanel.split .scratchresize{display:none}

  /* โหมดแบ่งครึ่งจอ — บีบพื้นที่ทำข้อสอบให้เหลือครึ่งซ้าย ให้กระดาษทดที่ปักขวาไม่ทับกัน */
  body.examsplit #app{width:50vw}
  body.examsplit .foot{width:50vw;right:auto}

</style>
</head>
<body>

<main id="app">
  <p class="wrap muted" style="padding:40px 0">กำลังโหลด…</p>
</main>

<script src="assets/site.js"></script>
<script src="assets/demo-data.js"></script>
<script>
(function(){
  "use strict";
  if (!requireLogin()) return;

  const params = new URLSearchParams(location.search);
  const slug = params.get("subject");
  const subject = SUBJECTS.find(s => s.slug === slug);
  const app = document.getElementById("app");

  if (!subject){
    app.innerHTML = '<div class="wrap" style="padding:60px 0;text-align:center">' +
      '<h1 style="margin-bottom:12px">ไม่พบวิชานี้</h1>' +
      '<a class="btn p" href="subjects.html">กลับไปเลือกวิชา</a></div>';
    renderHeader(); renderFooter();
    return;
  }

  document.title = subject.name + " — ทำข้อสอบ";

  const PASS_PERCENT = 60;
  const CONFIRM_BEFORE_SUBMIT = true;
  const user = getSession();
  const esc = escHtml;
  const LET = ["ก","ข","ค","ง","จ","ฉ"];

  const FALLBACK_COUNT = 10; // ใช้เมื่อยังไม่ได้ตั้งโครงสร้างชุดข้อสอบเลย
  let questions = [], sessionId = null, left = 0, timer = null, sent = false, demoAnswerKey = null;
  const ans = {};

  app.innerHTML = `
    <div class="mid" id="s1">
      <div class="examhead">
        <span class="eyebrow">${subject.icon} ${esc(subject.name)}</span>
        <h1 style="margin:10px 0 4px">เตรียมตัวก่อนเริ่มทำ</h1>
        <p class="muted" id="bpDesc">กำลังโหลดโครงสร้างชุดข้อสอบ…</p>
      </div>
      <div class="examhead">
        <div class="rule"><b>โครงสร้างข้อสอบ</b><span id="bpRule">กำลังโหลด…</span></div>
        <div class="rule"><b>เวลา</b><span>${subject.minutes} นาที หมดเวลาระบบจะส่งอัตโนมัติ</span></div>
        <div class="rule"><b>เกณฑ์ผ่าน</b><span>${PASS_PERCENT}%</span></div>
        <div class="rule"><b>จำนวนครั้ง</b><span>ทำได้หลายครั้งเพื่อฝึกฝน แต่ละครั้งได้ข้อสอบชุดใหม่</span></div>
      </div>
      <button class="btn p block" id="start" style="margin-top:6px">เริ่มทำแบบทดสอบ</button>
      <p id="n1" class="muted" style="text-align:center;margin-top:10px"></p>
    </div>
  `;
  renderHeader(); renderFooter();

  document.getElementById("start").onclick = startExam;

  (async function loadBlueprintPreview(){
    const { sections, total } = await blueprintSummary(subject.slug);
    if (!sections.length){
      document.getElementById("bpDesc").textContent = "ยังไม่ได้ตั้งโครงสร้างชุดข้อสอบ ระบบจะสุ่มข้อสอบจากคลังทั้งหมดแทน";
      document.getElementById("bpRule").textContent = "สุ่มจากคลังทั้งหมด";
      return;
    }
    document.getElementById("bpDesc").textContent = "ชุดข้อสอบนี้แบ่งเป็น " + sections.length + " ส่วน รวม " + total + " ข้อ";
    document.getElementById("bpRule").textContent = sections.length + " ส่วน รวม " + total + " ข้อ";
  })();

  async function startExam(){
    const btn = document.getElementById("start");
    btn.disabled = true; btn.textContent = "กำลังเตรียมข้อสอบ…";

    if (APP.demoMode){
      const bank = demoBankLoad(subject.slug);
      const bp = demoBlueprintLoad(subject.slug);
      if (bank.length && bp.length){
        demoAnswerKey = {};
        questions = [];
        const usedIds = {}; // กันข้อซ้ำข้ามส่วน — สองส่วนที่สุ่มจากสาระเดียวกันต้องไม่ได้ข้อเดียวกันซ้ำ
        bp.forEach((sec, i) => {
          const pool = bank.filter(q => q.strand === sec.strand && !usedIds[q.id]);
          const chosen = shuffleArr(pool.slice()).slice(0, Math.min(sec.count, pool.length));
          const label = "ส่วนที่ " + (i+1) + (sec.strand ? ": " + sec.strand : "");
          chosen.forEach(q => {
            usedIds[q.id] = true;
            demoAnswerKey[q.id] = { type: q.type, answer: q.answer, score: q.score || 1, note: q.note || "" };
            questions.push({ id: q.id, type: q.type, text: q.text, options: q.options, section: label });
          });
        });
      } else if (bank.length){
        const chosen = shuffleArr(bank.slice()).slice(0, Math.min(FALLBACK_COUNT, bank.length));
        demoAnswerKey = {};
        chosen.forEach(q => { demoAnswerKey[q.id] = { type: q.type, answer: q.answer, score: q.score || 1, note: q.note || "" }; });
        questions = chosen.map(q => ({ id: q.id, type: q.type, text: q.text, options: q.options, section: null }));
      } else {
        questions = genDemoQuestions(subject);
        demoAnswerKey = null;
      }
      sessionId = "demo";
    } else {
      try {
        const url = APP.endpoint + "?action=exam&subject=" + encodeURIComponent(subject.slug) +
          "&token=" + encodeURIComponent(APP.token);
        const r = await fetch(url);
        const res = await r.json();
        if (!res.ok) throw new Error(res.error || "โหลดข้อสอบไม่สำเร็จ");
        questions = res.questions;
        sessionId = res.sessionId;
      } catch(err){
        document.getElementById("n1").className = "bad";
        document.getElementById("n1").textContent = "โหลดข้อสอบไม่สำเร็จ ลองใหม่อีกครั้ง";
        btn.disabled = false; btn.textContent = "เริ่มทำแบบทดสอบ";
        return;
      }
    }

    buildExamScreen();
    startClock();
  }

  function genDemoQuestions(sub){
    const n = FALLBACK_COUNT;
    const list = [];
    for (let i = 1; i <= n; i++){
      list.push({
        id: "d" + i,
        type: "mc",
        text: "ตัวอย่างข้อที่ " + i + " ของวิชา" + sub.name + " (รอโจทย์จริงจากผู้ดูแลเว็บไซต์)",
        options: ["ตัวเลือก ก","ตัวเลือก ข","ตัวเลือก ค","ตัวเลือก ง"],
        section: null
      });
    }
    return list;
  }

  function buildExamScreen(){
    app.innerHTML = `
      <div class="bar">
        <span class="n">${esc(user.name)} · ${esc(subject.name)}</span>
        <span class="clock" id="clock">—</span>
      </div>
      <div class="prog"><i id="pg"></i></div>
      <div class="mid" id="qs"></div>
      <div class="foot"><div class="fin">
        <button class="btn p block" id="send">ส่งคำตอบ</button>
        <div id="note"></div>
      </div></div>
      <div class="mask" id="mask">
        <div class="modal">
          <h3 id="m-t"></h3>
          <p id="m-b"></p>
          <div class="rowb">
            <button class="btn p" id="m-ok"></button>
            <button class="btn s" id="m-no">ย้อนกลับ</button>
          </div>
        </div>
      </div>
      <button class="scratchfab" id="scratchToggle" type="button" title="กระดาษทด" aria-label="กระดาษทด">✏️</button>
      <div class="scratchpanel hidden" id="scratchPanel">
        <div class="scratchbar" id="scratchDragHandle">
          <span class="lbl">กระดาษทด</span>
          <button class="swatch on" data-color="#111111" style="background:#111111" title="ปากกาดำ" type="button"></button>
          <button class="swatch" data-color="#d92d2d" style="background:#d92d2d" title="ปากกาแดง" type="button"></button>
          <button class="swatch" data-color="#2a63e0" style="background:#2a63e0" title="ปากกาน้ำเงิน" type="button"></button>
          <button class="scratchbtn" id="scratchErase" title="ยางลบ" type="button">🧽</button>
          <button class="scratchbtn" id="scratchZoomOut" title="ซูมออก" type="button">➖</button>
          <span class="zoomlabel" id="zoomLabel">100%</span>
          <button class="scratchbtn" id="scratchZoomIn" title="ซูมเข้า" type="button">➕</button>
          <button class="scratchbtn" id="scratchSplit" title="แบ่งครึ่งจอ" type="button">⬛</button>
          <button class="scratchbtn" id="scratchClear" title="ล้างทั้งหมด" type="button">🗑️</button>
          <button class="scratchbtn" id="scratchClose" title="ปิด" type="button">✕</button>
        </div>
        <div class="scratchscroll" id="scratchScroll">
          <canvas id="scratchCanvas"></canvas>
        </div>
        <div class="scratchresize" id="scratchResize"></div>
      </div>
    `;

    const box = document.getElementById("qs");
    let lastSection;
    questions.forEach((q, i) => {
      if (q.section && q.section !== lastSection){
        const h = document.createElement("div");
        h.className = "sechead";
        h.textContent = q.section;
        box.appendChild(h);
        lastSection = q.section;
      }
      const c = document.createElement("div");
      c.className = "q";
      c.id = "c_" + q.id;
      c.innerHTML = '<div class="qh"><span class="qn">' + (i+1) + '</span><div class="qt">' + esc(q.text) + "</div></div>";
      c.appendChild(field(q));
      box.appendChild(c);
    });
    updateProgress();
    renderMath(box);
    renderImages(box);

    document.getElementById("send").onclick = onSend;
    initScratchpad();
  }

  function initScratchpad(){
    const fab = document.getElementById("scratchToggle");
    const panel = document.getElementById("scratchPanel");
    const dragHandle = document.getElementById("scratchDragHandle");
    const canvas = document.getElementById("scratchCanvas");
    const resizeHandle = document.getElementById("scratchResize");
    const ctx = canvas.getContext("2d");
    let color = "#111111", erasing = false, drawing = false, sized = false, zoom = 1, splitOn = false;
    let floatingRect = null; // จำตำแหน่ง/ขนาดหน้าต่างลอยล่าสุด ไว้กลับมาใช้ตอนสลับออกจากโหมดแบ่งครึ่งจอ

    const PAGE_W = 900, PAGE_H = 2600; // ขนาด "หน้ากระดาษ" คงที่ — ยาวกว่าจอมาก เลื่อนดูได้ทั้งหน้า ไม่ต้องรีไซส์ตามหน้าต่าง

    function sizeCanvasOnce(){
      if (sized) return;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = PAGE_W * dpr;
      canvas.height = PAGE_H * dpr;
      canvas.style.width = PAGE_W + "px";
      canvas.style.height = PAGE_H + "px";
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      sized = true;
    }
    function applyZoom(){
      canvas.style.transform = "scale(" + zoom + ")";
      document.getElementById("zoomLabel").textContent = Math.round(zoom * 100) + "%";
    }
    function defaultFloatingRect(){
      const w = Math.min(380, window.innerWidth - 32);
      const h = Math.min(460, window.innerHeight - 160);
      return { w, h, left: window.innerWidth - w - 18, top: Math.max(70, window.innerHeight - h - 130) };
    }
    function applyRect(r){
      panel.style.width = r.w + "px";
      panel.style.height = r.h + "px";
      panel.style.left = r.left + "px";
      panel.style.top = r.top + "px";
    }
    // แปลงพิกัดจากจอเป็นพิกัดในบิตแมพแคนวาส — ใช้อัตราส่วนจาก getBoundingClientRect
    // ครอบคลุมทั้งซูม (CSS transform) และ devicePixelRatio ในสูตรเดียว ไม่ต้องคำนวณแยก
    function pos(e){
      const rect = canvas.getBoundingClientRect();
      return { x: (e.clientX - rect.left) / rect.width * canvas.width, y: (e.clientY - rect.top) / rect.height * canvas.height };
    }

    canvas.addEventListener("pointerdown", e => {
      if (e.pointerType === "touch") return; // นิ้วไว้เลื่อนหน้ากระดาษ (สโครลปกติ) ปากกา/เมาส์เท่านั้นที่วาด
      drawing = true;
      canvas.setPointerCapture(e.pointerId);
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      e.preventDefault();
    });
    canvas.addEventListener("pointermove", e => {
      if (!drawing || e.pointerType === "touch") return;
      const dpr = window.devicePixelRatio || 1;
      const p = pos(e);
      ctx.globalCompositeOperation = erasing ? "destination-out" : "source-over";
      ctx.lineWidth = (erasing ? 22 : 2.5) * dpr;
      ctx.strokeStyle = color;
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    });
    const stopDraw = () => { drawing = false; };
    canvas.addEventListener("pointerup", stopDraw);
    canvas.addEventListener("pointercancel", stopDraw);
    canvas.addEventListener("pointerleave", stopDraw);

    panel.querySelectorAll(".swatch").forEach(btn => {
      btn.onclick = () => {
        panel.querySelectorAll(".swatch").forEach(b => b.classList.remove("on"));
        btn.classList.add("on");
        color = btn.dataset.color;
        erasing = false;
        document.getElementById("scratchErase").classList.remove("on");
      };
    });
    document.getElementById("scratchErase").onclick = (e) => {
      erasing = !erasing;
      e.currentTarget.classList.toggle("on", erasing);
    };
    document.getElementById("scratchClear").onclick = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    };
    document.getElementById("scratchClose").onclick = () => panel.classList.add("hidden");
    document.getElementById("scratchZoomIn").onclick = () => { zoom = Math.min(3, zoom + 0.25); applyZoom(); };
    document.getElementById("scratchZoomOut").onclick = () => { zoom = Math.max(0.5, zoom - 0.25); applyZoom(); };
    // เริ่ม/สิ้นสุดตรง "ใต้ header" พอดี ไม่ใช่ top:0 ตายตัว เพราะโหมดตัวอย่างมีแบนเนอร์แถบบนทำให้ header ยังไม่ขยับไปสุดจอตอนหน้าเพิ่งโหลด
    function positionSplit(){
      if (!splitOn) return;
      const header = document.querySelector("header.site");
      const top = header ? header.getBoundingClientRect().bottom : 0;
      panel.style.top = top + "px";
      panel.style.height = "calc(100vh - " + top + "px)";
    }
    document.getElementById("scratchSplit").onclick = (e) => {
      splitOn = !splitOn;
      e.currentTarget.classList.toggle("on", splitOn);
      document.body.classList.toggle("examsplit", splitOn);
      panel.classList.toggle("split", splitOn);
      if (splitOn) positionSplit();
      else applyRect(floatingRect || defaultFloatingRect());
    };
    window.addEventListener("resize", positionSplit);
    window.addEventListener("scroll", positionSplit, { passive: true });

    fab.onclick = () => {
      const willShow = panel.classList.contains("hidden");
      panel.classList.toggle("hidden");
      if (willShow){
        sizeCanvasOnce();
        if (!panel.style.width) applyRect(defaultFloatingRect());
        applyZoom();
      }
    };

    // ── ลากย้ายหน้าต่าง (จับที่แถบหัว) — ปิดใช้งานระหว่างแบ่งครึ่งจอเพราะตำแหน่ง/ขนาดถูกล็อกไว้แล้ว ──
    // กันลากแถบหัวขึ้นไปมุดใต้ header.site (z-index สูงกว่าแผงกระดาษทด) เพราะจะจับแถบหัวเพื่อลากกลับลงมาไม่ได้อีก
    function minPanelTop(){
      const header = document.querySelector("header.site");
      return header ? header.getBoundingClientRect().bottom : 0;
    }
    let dragOffset = null;
    dragHandle.addEventListener("pointerdown", e => {
      if (splitOn || e.target.closest("button")) return;
      dragOffset = { x: e.clientX - panel.offsetLeft, y: e.clientY - panel.offsetTop };
      dragHandle.setPointerCapture(e.pointerId);
    });
    dragHandle.addEventListener("pointermove", e => {
      if (!dragOffset) return;
      const left = Math.min(Math.max(0, e.clientX - dragOffset.x), window.innerWidth - 60);
      const top = Math.min(Math.max(minPanelTop(), e.clientY - dragOffset.y), window.innerHeight - 40);
      panel.style.left = left + "px";
      panel.style.top = top + "px";
    });
    const stopDrag = () => {
      if (dragOffset) floatingRect = { w: panel.offsetWidth, h: panel.offsetHeight, left: panel.offsetLeft, top: panel.offsetTop };
      dragOffset = null;
    };
    dragHandle.addEventListener("pointerup", stopDrag);
    dragHandle.addEventListener("pointercancel", stopDrag);

    // ── ลากมุมขวาล่างเพื่อปรับขนาดหน้าต่าง ──
    let resizing = null;
    resizeHandle.addEventListener("pointerdown", e => {
      resizing = { startX: e.clientX, startY: e.clientY, w: panel.offsetWidth, h: panel.offsetHeight };
      resizeHandle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    resizeHandle.addEventListener("pointermove", e => {
      if (!resizing) return;
      panel.style.width = Math.max(260, resizing.w + (e.clientX - resizing.startX)) + "px";
      panel.style.height = Math.max(240, resizing.h + (e.clientY - resizing.startY)) + "px";
    });
    const stopResize = () => {
      if (resizing) floatingRect = { w: panel.offsetWidth, h: panel.offsetHeight, left: panel.offsetLeft, top: panel.offsetTop };
      resizing = null;
    };
    resizeHandle.addEventListener("pointerup", stopResize);
    resizeHandle.addEventListener("pointercancel", stopResize);
  }

  function field(q){
    if (q.type === "fill"){
      const i = document.createElement("input");
      i.type = "text";
      i.className = "fillbox";
      i.placeholder = "พิมพ์คำตอบ";
      i.setAttribute("aria-label", q.text);
      i.oninput = () => {
        ans[q.id] = i.value.trim();
        document.getElementById("c_" + q.id).classList.remove("err");
        updateProgress();
      };
      return i;
    }

    const list = (q.options && q.options.length) ? q.options : ["ถูก","ผิด"];
    const w = document.createElement("div");
    w.className = "opts";
    w.setAttribute("role","radiogroup");
    w.setAttribute("aria-label", q.text);
    list.forEach((o, i) => {
      const lab = document.createElement("label");
      lab.className = "opt";
      lab.innerHTML = '<input type="radio" name="' + q.id + '" value="' + esc(o) + '">' +
        '<span class="mk">' + LET[i] + '</span><span>' + esc(o) + '</span>';
      const inp = lab.querySelector("input");
      inp.onchange = () => {
        ans[q.id] = inp.value;
        [...w.children].forEach(x => x.classList.remove("on"));
        lab.classList.add("on");
        document.getElementById("c_" + q.id).classList.remove("err");
        updateProgress();
      };
      w.appendChild(lab);
    });
    return w;
  }

  const done = q => ans[q.id] !== undefined && ans[q.id] !== "";
  function updateProgress(){
    const n = questions.filter(done).length;
    document.getElementById("pg").style.width = (n / questions.length * 100) + "%";
  }

  function startClock(){
    left = subject.minutes * 60;
    showClock();
    timer = setInterval(() => {
      left--;
      showClock();
      if (left <= 0){ clearInterval(timer); submit(true); }
    }, 1000);
  }
  function showClock(){
    const m = Math.floor(left/60), s = left % 60;
    const el = document.getElementById("clock");
    el.textContent = m + ":" + String(s).padStart(2,"0");
    el.classList.toggle("hot", left <= 60);
  }

  function modal(t, b, okTxt, fn){
    document.getElementById("m-t").textContent = t;
    document.getElementById("m-b").textContent = b;
    document.getElementById("m-ok").textContent = okTxt;
    document.getElementById("mask").classList.add("on");
    document.getElementById("m-ok").onclick = () => { document.getElementById("mask").classList.remove("on"); fn(); };
    document.getElementById("m-no").onclick = () => document.getElementById("mask").classList.remove("on");
  }

  function onSend(){
    const miss = questions.filter(q => !done(q));
    if (miss.length){
      miss.forEach(q => document.getElementById("c_" + q.id).classList.add("err"));
      document.getElementById("note").className = "bad";
      document.getElementById("note").textContent = "ยังไม่ได้ตอบ " + miss.length + " ข้อ";
      document.getElementById("c_" + miss[0].id).scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }
    if (CONFIRM_BEFORE_SUBMIT){
      modal("ยืนยันการส่งคำตอบ", "ส่งแล้วจะแก้ไขไม่ได้ ตรวจทานเรียบร้อยแล้วใช่หรือไม่", "ยืนยัน ส่งคำตอบ", () => submit(false));
    } else submit(false);
  }

  async function submit(auto){
    if (sent) return;
    sent = true;
    if (timer) clearInterval(timer);
    document.getElementById("mask").classList.remove("on");

    const btn = document.getElementById("send");
    btn.disabled = true;
    btn.textContent = auto ? "หมดเวลา กำลังส่ง…" : "กำลังส่ง…";

    if (APP.demoMode){
      await new Promise(r => setTimeout(r, 700));
      const detail = {};
      let score = 0, total = 0;

      if (demoAnswerKey){
        // มีข้อสอบจริงที่แอดมินเพิ่มไว้ผ่าน admin.html — ตรวจให้คะแนนจริงในเครื่อง
        questions.forEach(q => {
          const k = demoAnswerKey[q.id];
          const pt = k.score || 1;
          total += pt;
          const right = answerMatches(k.type, ans[q.id], k.answer);
          if (right) score += pt;
          detail[q.id] = { correct: right, answer: k.answer, note: k.note || "" };
        });
      } else {
        // ยังไม่มีข้อสอบจริงในคลัง — จำลองผลให้ดูหน้าตาเท่านั้น
        questions.forEach((q,i) => {
          detail[q.id] = { correct: i % 3 !== 0, answer: "(โหมดตัวอย่างไม่มีเฉลยจริง — เพิ่มข้อสอบผ่านหน้าแอดมินก่อน)", note: "โหมดตัวอย่าง ยังไม่ได้เชื่อมระบบตรวจจริง" };
        });
        total = questions.length;
        score = Math.round(questions.length * 0.7);
      }

      const percent = total ? Math.round(score/total*100) : 0;
      const passed = percent >= PASS_PERCENT;
      demoResultsAdd({
        timestamp: new Date().toISOString(), subject: subject.slug, email: user.email,
        score, total, percent, passed,
        usedSeconds: subject.minutes*60 - Math.max(left,0), auto: !!auto
      });
      render({ ok:true, score, total, percent, passed, detail });
      return;
    }

    const payload = {
      token: APP.token,
      action: "submitExam",
      subject: subject.slug,
      sessionId,
      identity: { name: user.name, email: user.email },
      answers: ans,
      meta: { used: subject.minutes*60 - Math.max(left,0), auto: !!auto }
    };

    try {
      const r = await fetch(APP.endpoint, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const res = await r.json();
      if (!res.ok) throw new Error(res.error || "ส่งไม่สำเร็จ");
      render(res);
    } catch(err){
      sent = false;
      btn.disabled = false;
      btn.textContent = "ลองส่งอีกครั้ง";
      if (subject.minutes && left > 0) timer = setInterval(() => { left--; showClock(); if (left<=0){clearInterval(timer); submit(true);} }, 1000);
      document.getElementById("note").className = "bad";
      document.getElementById("note").textContent = "ส่งไม่สำเร็จ ตรวจสัญญาณอินเทอร์เน็ตแล้วกดส่งใหม่";
    }
  }

  function render(res){
    const pct = res.percent, pass = res.passed;
    const col = pass ? "var(--ok)" : "var(--danger)";
    const dash = 2 * Math.PI * 64;

    let h = '<div class="q">' +
      '<div class="ring"><svg width="150" height="150">' +
      '<circle cx="75" cy="75" r="64" fill="none" stroke="rgba(0,0,0,.1)" stroke-width="11"/>' +
      '<circle cx="75" cy="75" r="64" fill="none" stroke="' + col + '" stroke-width="11" stroke-linecap="round" ' +
      'stroke-dasharray="' + dash + '" stroke-dashoffset="' + (dash * (1 - pct/100)) + '"/></svg>' +
      '<div class="val" style="color:' + col + '">' + pct + '%</div></div>' +
      '<div class="verdict"><span class="pill ' + (pass ? "ok" : "no") + '">' + (pass ? "ผ่านเกณฑ์" : "ยังไม่ผ่านเกณฑ์") + '</span>' +
      '<h2>' + res.score + ' / ' + res.total + ' คะแนน</h2>' +
      '<p class="muted">เกณฑ์ผ่าน ' + PASS_PERCENT + '%</p></div></div>';

    h += '<h3 style="margin:22px 0 12px;font-size:18px">เฉลยรายข้อ</h3>';
    questions.forEach((q, i) => {
      const d = res.detail && res.detail[q.id];
      if (!d) return;
      const answerDisplay = String(d.answer || "").split("|").join(" หรือ ");
      h += '<div class="rev ' + (d.correct ? "r" : "w") + '">' +
        '<div class="t">' + (i+1) + '. ' + esc(q.text) + '</div>' +
        '<div class="l">คำตอบของคุณ: <b>' + esc(ans[q.id]) + '</b></div>' +
        (d.correct ? '' : '<div class="l">คำตอบที่ถูก: <b>' + esc(answerDisplay) + '</b></div>') +
        (d.note ? '<div class="l">' + esc(d.note) + '</div>' : '') + '</div>';
    });

    h += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">' +
      '<a class="btn p" href="exam.html?subject=' + subject.slug + '">ทำข้อสอบชุดใหม่</a>' +
      '<a class="btn s" href="subjects.html">เลือกวิชาอื่น</a></div>';

    app.innerHTML = '<div class="mid" style="padding-top:24px">' + h + '</div>';
    renderMath(app);
    renderImages(app);
    window.scrollTo(0,0);
  }
})();
</script>
</body>
