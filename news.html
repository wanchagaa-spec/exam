<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บอร์ดความคิดเห็น — ข้อสอบ</title>
<meta name="description" content="บอร์ดความคิดเห็นแยกตามวิชา โพสต์ถามตอบ กดถูกใจและแสดงความคิดเห็นกันได้">
<link rel="canonical" href="https://wanchagaa-spec.github.io/exam/news.html">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  .filterbar .field{margin-bottom:0;min-width:200px}
  .sorttabs{display:flex;gap:6px}
  .sorttabs button{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;
    font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
  .sorttabs button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
</style>
</head>
<body>

<main>
  <section class="hero" style="padding-bottom:20px">
    <div class="wrap">
      <span class="eyebrow">บอร์ดความคิดเห็น</span>
      <h1>บอร์ดความคิดเห็น</h1>
      <p class="lead">โพสต์ถามตอบ แลกเปลี่ยนความเห็นแยกตามรายวิชา กดถูกใจและแสดงความคิดเห็นกันได้เลย — โพสต์ใหม่ได้จากปุ่ม + บน header</p>
    </div>
  </section>

  <section class="section" style="padding-top:10px">
    <div class="wrap" style="max-width:720px;margin:0 auto">
      <div id="loginPrompt" class="card hidden" style="margin-bottom:26px;text-align:center">
        <p class="muted" style="margin-bottom:14px">เข้าสู่ระบบเพื่อดูและร่วมพูดคุยในบอร์ดความคิดเห็น</p>
        <a class="btn p" href="login.html?next=news.html">เข้าสู่ระบบ</a>
      </div>

      <div id="boardArea" class="hidden">
        <div class="filterbar">
          <div class="field">
            <label for="filterSubject">กรองตามวิชา</label>
            <select id="filterSubject"></select>
          </div>
          <div class="sorttabs" id="sortTabs" style="margin-top:24px">
            <button data-sort="new" class="on" type="button">ใหม่ล่าสุด</button>
            <button data-sort="likes" type="button">ถูกใจมากที่สุด</button>
          </div>
        </div>

        <div id="list"></div>
      </div>
    </div>
  </section>
</main>

<script src="assets/site.js"></script>
<script src="assets/demo-data.js"></script>
<script>
(function(){
  "use strict";
  renderHeader("news.html");
  renderFooter();

  const user = getSession();
  if (!user){
    document.getElementById("loginPrompt").classList.remove("hidden");
    return;
  }
  document.getElementById("boardArea").classList.remove("hidden");

  let currentSort = "new";
  const filterSel = document.getElementById("filterSubject");
  filterSel.innerHTML = '<option value="">ทั้งหมดทุกวิชา</option>' +
    SUBJECTS.map(s => `<option value="${s.slug}">${s.icon} ${escHtml(s.name)}</option>`).join("");

  const board = createPostBoard({
    listEl: document.getElementById("list"),
    user,
    emptyMessage: "ยังไม่มีโพสต์ในหมวดนี้ กด + บน header เพื่อเป็นคนแรกที่โพสต์ได้เลย",
    onChange: loadPosts
  });

  async function loadPosts(){
    const list = document.getElementById("list");
    list.innerHTML = '<p class="muted">กำลังโหลด…</p>';
    const res = await apiCall("listPosts", { subject: filterSel.value, sort: currentSort, viewerEmail: user.email });
    if (!res.ok){ list.innerHTML = `<div class="msg bad">${escHtml(res.error || "โหลดไม่สำเร็จ")}</div>`; return; }
    board.render(res.posts || []);
  }

  filterSel.onchange = loadPosts;
  document.querySelectorAll("#sortTabs button").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll("#sortTabs button").forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
      currentSort = btn.dataset.sort;
      loadPosts();
    };
  });

  loadPosts();
  document.addEventListener("examSitePostCreated", loadPosts);
})();
</script>
</body>
</html>
